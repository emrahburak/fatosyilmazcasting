name = "fatosyilmazcasting"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# D1 Database Binding
[[d1_databases]]
binding = "__D1_Binding__"
database_name = "fatosyilmazcasting-db"
database_id = "YOUR_D1_DATABASE_ID"

# R2 Bucket Binding
[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "fatosyilmazcasting-media"

# Local development
[dev]
port = 3001
local_protocol = "http"
