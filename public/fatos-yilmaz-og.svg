<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&amp;display=swap');
      .brand { font-family: 'Cinzel', serif; font-size: 44px; font-weight: 700; fill: #c9a96e; letter-spacing: 6px; }
      .brand-sub { font-family: 'Cinzel', serif; font-size: 28px; font-weight: 600; fill: #c9a96e; letter-spacing: 10px; }
      .title { font-family: 'Cinzel', serif; font-size: 32px; font-weight: 600; fill: #f5f0e8; letter-spacing: 8px; }
      .cities { font-family: 'Cinzel', serif; font-size: 17px; font-weight: 400; fill: #c9a96e; letter-spacing: 4px; }
      .ig { font-family: 'Cinzel', serif; font-size: 17px; font-weight: 600; fill: #c9a96e; letter-spacing: 3px; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#1a1a1a"/>

  <!-- Subtle border frame -->
  <rect x="40" y="40" width="1120" height="550" fill="none" stroke="#c9a96e" stroke-width="0.5" opacity="0.25"/>

  <!-- Corner accents -->
  <line x1="40" y1="80" x2="40" y2="40" stroke="#c9a96e" stroke-width="1" opacity="0.4"/>
  <line x1="40" y1="40" x2="80" y2="40" stroke="#c9a96e" stroke-width="1" opacity="0.4"/>
  <line x1="1160" y1="80" x2="1160" y2="40" stroke="#c9a96e" stroke-width="1" opacity="0.4"/>
  <line x1="1160" y1="40" x2="1120" y2="40" stroke="#c9a96e" stroke-width="1" opacity="0.4"/>
  <line x1="40" y1="550" x2="40" y2="590" stroke="#c9a96e" stroke-width="1" opacity="0.4"/>
  <line x1="40" y1="590" x2="80" y2="590" stroke="#c9a96e" stroke-width="1" opacity="0.4"/>
  <line x1="1160" y1="550" x2="1160" y2="590" stroke="#c9a96e" stroke-width="1" opacity="0.4"/>
  <line x1="1160" y1="590" x2="1120" y2="590" stroke="#c9a96e" stroke-width="1" opacity="0.4"/>

  <!-- ===== NAVBAR LOGO: Circular "f" ===== -->
  <g transform="translate(600, 95)">
    <circle cx="0" cy="0" r="42" stroke="#c9a96e" stroke-width="1.5" fill="none" opacity="0.9"/>
    <text
      x="0"
      y="4"
      dominant-baseline="middle"
      text-anchor="middle"
      fill="#c9a96e"
      style="font-family: 'Times New Roman', serif; font-size: 64px; font-style: italic;"
    >f</text>
  </g>

  <!-- Brand Name -->
  <text x="600" y="185" text-anchor="middle" class="brand">FATOŞ YILMAZ</text>
  <text x="600" y="225" text-anchor="middle" class="brand-sub">MANAGEMENT</text>

  <!-- Separator -->
  <line x1="420" y1="265" x2="550" y2="265" stroke="#c9a96e" stroke-width="0.8" opacity="0.5"/>
  <polygon points="600,259 606,265 600,271 594,265" fill="#c9a96e" opacity="0.7"/>
  <line x1="650" y1="265" x2="780" y2="265" stroke="#c9a96e" stroke-width="0.8" opacity="0.5"/>

  <!-- Title: CAST DIRECTOR (large, prominent) -->
  <text x="600" y="320" text-anchor="middle" class="title">CAST DIRECTOR</text>

  <!-- Cities (gold, clearly visible) -->
  <text x="600" y="365" text-anchor="middle" class="cities">Istanbul  ·  Zurich  ·  Berlin  ·  Amsterdam</text>

  <!-- Instagram handle with icon (centered) -->
  <g transform="translate(600, 420)">
    <!-- Instagram camera icon -->
    <rect x="-180" y="-14" width="22" height="22" rx="5" ry="5" fill="none" stroke="#c9a96e" stroke-width="1.5"/>
    <circle cx="-169" cy="-3" r="4.5" fill="none" stroke="#c9a96e" stroke-width="1.5"/>
    <circle cx="-163" cy="-9.5" r="1.3" fill="#c9a96e" stroke="none"/>
    <!-- Text centered, shifted right to avoid icon overlap -->
    <text x="25" y="0" text-anchor="middle" class="ig">fatosyilmazmanagement</text>
  </g>
</svg>
