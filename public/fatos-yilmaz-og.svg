<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&amp;display=swap');
      .brand { font-family: 'Cinzel', serif; font-size: 52px; font-weight: 600; fill: #c9a96e; letter-spacing: 6px; }
      .sub { font-family: 'Cinzel', serif; font-size: 18px; font-weight: 400; fill: #f5f0e8; letter-spacing: 4px; }
      .cities { font-family: 'Cinzel', serif; font-size: 13px; font-weight: 400; fill: #8a8278; letter-spacing: 3px; }
      .ig { font-family: 'Cinzel', serif; font-size: 13px; font-weight: 400; fill: #c9a96e; letter-spacing: 2px; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#1a1a1a"/>

  <!-- Subtle border frame -->
  <rect x="40" y="40" width="1120" height="550" fill="none" stroke="#c9a96e" stroke-width="0.5" opacity="0.2"/>

  <!-- Brand Name -->
  <text x="600" y="240" text-anchor="middle" class="brand">FATOŞ YILMAZ</text>
  <text x="600" y="295" text-anchor="middle" class="brand" style="font-size: 38px; letter-spacing: 12px;">MANAGEMENT</text>

  <!-- Separator -->
  <line x1="480" y1="340" x2="570" y2="340" stroke="#c9a96e" stroke-width="0.8" opacity="0.6"/>
  <circle cx="600" cy="340" r="3" fill="#c9a96e" opacity="0.8"/>
  <line x1="630" y1="340" x2="720" y2="340" stroke="#c9a96e" stroke-width="0.8" opacity="0.6"/>

  <!-- Title -->
  <text x="600" y="390" text-anchor="middle" class="sub">Cast Direktörü</text>

  <!-- Cities -->
  <text x="600" y="430" text-anchor="middle" class="cities">İstanbul · Zurich · Berlin · Amsterdam</text>

  <!-- Instagram -->
  <text x="600" y="500" text-anchor="middle" class="ig">@fatosyilmazmanagement</text>
</svg>
